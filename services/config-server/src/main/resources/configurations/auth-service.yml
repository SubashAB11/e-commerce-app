spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: subash
    password: subash
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    show-sql: true

  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring.json.value.default.type: com.abs.auth.dto.CustomerRegistration

server:
  port: 8020

app:
  security:
    jwt:
      access-token-exp: 86400000 #24 hrs
      refresh-token-exp: 604800000 #7 days